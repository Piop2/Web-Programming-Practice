<!DOCTYPE html>
<html lang="ko">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>도서 구입 신청</title>
       <style>
              body {
                     font-family: "Malgun Gothic", sans-serif;
                     max-width: 560px;
                     margin: 40px auto;
                     line-height: 1.6;
              }

              h1 {
                     text-align: center;
                     font-size: 1.5em;
              }

              fieldset {
                     border: 1px solid #ccc;
                     border-radius: 8px;
                     margin-bottom: 16px;
                     padding: 12px 20px;
              }

              legend {
                     color: #2a5db0;
                     font-weight: bold;
              }

              label {
                     display: block;
                     margin: 8px 0 4px;
              }

              input[type="text"],
              input[type="email"],
              select,
              textarea {
                     width: 100%;
                     padding: 6px;
                     box-sizing: border-box;
              }

              .inline label {
                     display: inline;
                     margin-right: 12px;
              }

              .buttons {
                     text-align: center;
              }

              .buttons button {
                     padding: 8px 20px;
                     margin: 0 4px;
                     cursor: pointer;
              }
       </style>
</head>

<body>
       <h1>도서 구입 신청서</h1>

       <form method="get" action="https://lib.smu.ac.kr/search/">
              <fieldset>
                     <legend>기본 정보</legend>

                     <label for="keyword">검색어</label>
                     <input type="text" id="keyword" name="q">

                     <label for="mail">이메일</label>
                     <input type="email" id="mail" name="email" placeholder="example@naver.com">

                     <label>소속 캠퍼스</label>
                     <div class="inline">
                            <label><input type="radio" name="campuscode" value="00"> 서울</label>
                            <label><input type="radio" name="campuscode" value="01" checked> 천안</label>
                     </div>

                     <label for="occupation">신분</label>
                     <select id="occupation" name="job">
                            <option>학생</option>
                            <option>회사원</option>
                            <option>공무원</option>
                            <option>기타</option>
                     </select>
              </fieldset>

              <fieldset>
                     <legend>희망 도서 (복수 선택 가능)</legend>
                     <div class="inline">
                            <label><input type="checkbox" name="books" value="computer"> 컴퓨터</label>
                            <label><input type="checkbox" name="books" value="economy"> 경제</label>
                            <label><input type="checkbox" name="books" value="common"> 상식</label>
                     </div>

                     <label for="memo">기타 요청사항</label>
                     <textarea id="memo" name="comments" rows="4"></textarea>
              </fieldset>

              <div class="buttons">
                     <button type="submit">신청하기</button>
                     <button type="reset">초기화</button>
                     <button type="button" onclick="alert('버튼이 클릭되었습니다')">확인</button>
              </div>
       </form>
</body>

</html>
